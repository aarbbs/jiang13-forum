name: 功能建议
about: 提出新功能或改进现有体验
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法！请先搜索已有 Issue，避免重复。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题？
      description: 从用户场景出发描述痛点
      placeholder: 管理员在 React 前台无法置顶帖子，必须切到旧版后台…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你心目中的实现方式（可简略）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 如有其他思路可一并说明
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 前台 UI/UX
        - 管理后台
        - 评论系统
        - 帖子 / 板块
        - 认证 / 权限
        - 部署 / 构建
        - 其他
    validations:
      required: true
